name: Build and deploy frontend

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          echo "Testing connection to $DEPLOY_HOST:$DEPLOY_PORT"

          ssh-keyscan -v -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"

          echo "ssh-keyscan exit code: $?"

          echo "Known hosts:"
          cat "$HOME/.ssh/known_hosts"

          EXPECTED="SHA256:9WuMbIQi1pZ7lhdzEztIHkxpxnvYX94M5dsCJBVzgQw"

          echo "Checking host fingerprint..."

          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256

          if ! ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | grep -F "$EXPECTED" > /dev/null; then
            echo "ERROR: SSH host key fingerprint does not match!"
            exit 1
          fi

          echo "SSH host fingerprint matches."

      - name: Deploy frontend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            deploy@"$DEPLOY_HOST" \
            'rm -rf /var/www/laravel-library/public/build/*'

          scp \
            -i ~/.ssh/deploy_key \
            -P "$DEPLOY_PORT" \
            -r public/build/* \
            deploy@"$DEPLOY_HOST":/var/www/laravel-library/public/build/
